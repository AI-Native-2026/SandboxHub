name: sandboxhub

services:
  postgres:
    image: postgres:16-alpine
    container_name: sandboxhub-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sandboxhub}
      POSTGRES_USER: ${POSTGRES_USER:-sandboxhub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sandboxhub}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sandboxhub} -d ${POSTGRES_DB:-sandboxhub}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: sandboxhub-redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    ports:
      - "${REDIS_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: sandboxhub-keycloak
    command: ["start-dev", "--import-realm", "--http-port=8080"]
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${POSTGRES_USER:-sandboxhub}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-sandboxhub}
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME: ${KEYCLOAK_PUBLIC_URL:-http://43.135.120.107:8081}
      KC_HOSTNAME_STRICT: "false"
      KC_PROXY_HEADERS: xforwarded
    volumes:
      - ./keycloak/realm.json:/opt/keycloak/data/import/realm.json:ro
    ports:
      - "${KEYCLOAK_PORT:-8180}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  bff:
    build:
      context: ../apps/bff
    container_name: sandboxhub-bff
    env_file: .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${BFF_PORT:-8001}:8001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ../apps/web
    container_name: sandboxhub-web
    ports:
      - "${WEB_PORT:-8081}:80"
    depends_on:
      - bff
      - keycloak
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
